<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结构化与工程化 · 思考与判断体系（子页）</title>
<script>location.replace('#/t/structure-engineering');</script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#0A0E17; --panel:#101624; --panel2:#151C2E; --panel3:#1A2338; --line:#24304A; --line2:#33435F;
  --text:#E5E9F0; --dim:#9AA7BD; --faint:#5C6B85; --accent:#FBBF24;
  --l0:#A78BFA; --l1:#6366F1; --l2:#3B82F6; --l3:#22D3EE; --l4:#34D399; --l5:#FBBF24; --io:#F8FAFC;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.75; font-size:15px; -webkit-font-smoothing:antialiased;}
body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(1200px 500px at 70% -10%, rgba(99,102,241,.10), transparent 60%),
             radial-gradient(900px 420px at 10% 20%, rgba(34,211,238,.06), transparent 55%),
             radial-gradient(700px 500px at 90% 90%, rgba(251,191,36,.05), transparent 60%);}
.wrap{position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:0 22px 70px;}

/* ===== 页头 ===== */
header.site{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding:22px 0 8px;}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.brand .t{font-family:var(--serif); font-size:23px; font-weight:900; letter-spacing:1px;}
.brand .t em{font-style:normal; color:var(--accent);}
.brand .s{color:var(--dim); font-size:13px;}
.hd-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.modebtn{border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:999px; padding:7px 16px; font-size:13px; cursor:pointer; font-family:var(--sans); transition:border-color .15s, background .15s;}
.modebtn:hover{border-color:var(--line2);}
.modebtn.on{background:rgba(167,139,250,.16); border-color:var(--l0); color:#D8CCFF;}
.modebtn small{display:block; font-size:11px; color:var(--dim); line-height:1.2;}
.modebtn.on small{color:#B7A6F5;}
#footprint{width:100%; margin-top:6px; font-size:12px; color:var(--faint); min-height:18px;}
#footprint b{color:var(--dim); font-weight:500;}
#footprint .fp-clear{background:none; border:none; color:var(--faint); text-decoration:underline; cursor:pointer; font-size:12px; margin-left:8px;}

/* ===== 导航 ===== */
nav.global{display:flex; flex-wrap:wrap; gap:6px; padding:10px 0 20px; border-bottom:1px solid var(--line); margin-bottom:26px;}
nav.global a{color:var(--dim); text-decoration:none; font-size:13.5px; border:1px solid var(--line); border-radius:999px; padding:6px 14px; transition:all .15s;}
nav.global a:hover{color:var(--text); border-color:var(--line2);}
nav.global a.cur{color:#0B1020; background:var(--accent); border-color:transparent; font-weight:600;}

/* ===== 通用卡片 ===== */
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:20px;}
.card h2{font-family:var(--serif); font-size:18px; margin-bottom:4px; display:flex; align-items:center; gap:9px;}
.card h2 .num{color:var(--accent); font-size:13px; letter-spacing:1px; font-family:var(--sans);}
.card .note{color:var(--dim); font-size:13px; margin-bottom:14px;}
.sechead{font-family:var(--serif); font-size:21px; font-weight:900; margin:34px 0 6px;}
.sechead small{display:block; font-family:var(--sans); font-size:13px; color:var(--dim); font-weight:400; margin-top:2px;}

/* ===== 主循环 ===== */
.loop-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.chip{min-height:44px; display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer; user-select:none; transition:all .18s; font-family:var(--sans);}
.chip .num{font-size:11px; opacity:.6; font-variant-numeric:tabular-nums;}
.chip.active{color:#0B1020; border-color:transparent; box-shadow:0 0 0 2px rgba(255,255,255,.14);}
.chip[data-lyr="l0"].active{background:var(--l0);} .chip[data-lyr="l1"].active{background:var(--l1);}
.chip[data-lyr="l2"].active{background:var(--l2);} .chip[data-lyr="l3"].active{background:var(--l3);}
.chip[data-lyr="l4"].active{background:var(--l4);} .chip[data-lyr="l5"].active{background:var(--l5);}
.chip[data-lyr="io"].active{background:var(--io);}
.chip.done{border-color:#3A4B6E; color:var(--text);}
.controls{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px;}
.btn{min-height:44px; min-width:66px; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:10px; padding:8px 18px; font-size:14px; cursor:pointer; transition:all .15s; font-family:var(--sans);}
.btn:hover{border-color:var(--line2);}
.btn.primary{background:var(--accent); color:#141000; border-color:transparent; font-weight:600;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.status{min-height:56px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); padding:10px 14px; font-size:14px;}
.status b{font-variant-numeric:tabular-nums;}
.status .lyr{color:var(--accent); font-weight:600;}

/* ===== 主页：层堆栈 + 详情 ===== */
.main{display:grid; grid-template-columns:minmax(320px,430px) 1fr; gap:20px; margin-bottom:20px; align-items:start;}
.stack{display:flex; flex-direction:column; gap:8px;}
.layer{min-height:54px; display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:8px 14px; cursor:pointer; user-select:none; transition:transform .15s, box-shadow .15s, border-color .15s, opacity .2s; font-family:var(--sans); color:var(--text); text-align:left; width:100%;}
.layer:hover{transform:translateX(4px);}
.layer.sel{border-color:currentColor; box-shadow:0 0 0 2px currentColor;}
.layer.dim{opacity:.3;}
.layer .dot{width:12px; height:12px; border-radius:50%; flex:none;}
.layer .tt{font-weight:700; font-size:14px;}
.layer .q{color:var(--dim); font-size:12.5px; margin-left:auto; text-align:right;}
.layer.l0{color:var(--l0);} .layer.l1{color:var(--l1);} .layer.l2{color:var(--l2);}
.layer.l3{color:var(--l3);} .layer.l4{color:var(--l4);} .layer.l5{color:var(--l5);}
.layer.l0 .dot{background:var(--l0);} .layer.l1 .dot{background:var(--l1);} .layer.l2 .dot{background:var(--l2);}
.layer.l3 .dot{background:var(--l3);} .layer.l4 .dot{background:var(--l4);} .layer.l5 .dot{background:var(--l5);}
.layer.io{color:var(--io); border-style:dashed;}
.layer.io .dot{background:var(--io);}
.stackfoot{margin-top:8px; color:var(--faint); font-size:12px; text-align:center;}
#detail{min-height:430px;}
.d-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.d-dot{width:14px; height:14px; border-radius:50%; flex:none;}
.d-title{font-size:20px; font-weight:900; font-family:var(--serif);}
.d-q{color:var(--dim); font-size:14.5px; margin-bottom:14px; border-left:3px solid currentColor; padding-left:11px;}
.d-sec{margin-bottom:14px;}
.d-sec h4{font-size:12px; letter-spacing:1px; color:var(--dim); margin-bottom:6px; font-family:var(--sans);}
.d-sec ul{list-style:none; display:flex; flex-wrap:wrap; gap:7px;}
.d-sec li{background:var(--panel3); border:1px solid var(--line); border-radius:8px; padding:5px 11px; font-size:13px;}
.d-sec .big{font-size:14px; line-height:1.7;}
.d-pages{display:flex; flex-wrap:wrap; gap:9px;}
.d-page{border:1px solid var(--line); border-radius:10px; padding:8px 13px; font-size:13px; background:var(--panel2);}
.d-page small{display:block; color:var(--faint); font-size:11px;}

/* ===== 根问题 ===== */
.rq-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px;}
.rq{min-height:100px; border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:13px 15px; cursor:pointer; user-select:none; transition:border-color .15s, box-shadow .15s; text-align:left; font-family:var(--sans); color:var(--text);}
.rq:hover{border-color:var(--line2);}
.rq.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(251,191,36,.25);}
.rq .t{font-size:16px; font-weight:800; margin-bottom:2px; font-family:var(--serif);}
.rq .d{color:var(--dim); font-size:12.5px;}
#rq-result{min-height:60px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); padding:11px 15px; font-size:13.5px; color:var(--dim);}
#rq-result b{color:var(--text);}

/* ===== 子页入口 ===== */
.topic-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.topic{border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:13px 15px; text-decoration:none; color:var(--text); display:block; transition:border-color .15s, transform .15s;}
.topic:hover{border-color:var(--line2); transform:translateY(-2px);}
.topic .badge{display:inline-block; font-size:11px; border-radius:6px; padding:1px 8px; margin-bottom:7px; color:#0B1020; font-weight:700;}
.topic .nm{font-size:15px; font-weight:800; margin-bottom:3px;}
.topic .ess{color:var(--dim); font-size:12.5px;}
.topic .src{color:var(--faint); font-size:11px; margin-top:7px;}

/* ===== 关联图谱 ===== */
.graphbox{border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:10px; overflow:hidden;}
.graphbox svg{display:block; width:100%; height:auto;}
.graphbox .g-legend{color:var(--faint); font-size:11.5px; padding:4px 8px 2px;}

/* ===== 子页模板 ===== */
.bc{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12.5px; color:var(--faint); margin-bottom:14px;}
.bc a{color:var(--dim); text-decoration:none;}
.bc a:hover{color:var(--text);}
.bc .sep{opacity:.5;}
.phead{display:flex; align-items:center; gap:12px; margin-bottom:8px; flex-wrap:wrap;}
.phead h1{font-family:var(--serif); font-size:28px; font-weight:900;}
.badge{display:inline-block; font-size:12px; border-radius:7px; padding:2px 11px; color:#0B1020; font-weight:700;}
.oneliner{font-family:var(--serif); font-size:17px; line-height:1.85; color:#DCE3EF; border-left:3px solid var(--accent); padding:10px 18px; margin:14px 0 8px; background:linear-gradient(90deg, rgba(251,191,36,.07), transparent 70%); border-radius:0 10px 10px 0;}
.coord{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px;}
.coord span{font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:3px 12px; background:var(--panel2);}
.src-line{font-size:12px; color:var(--faint); margin:8px 0 22px;}
.collapse{border:1px solid var(--line); border-radius:12px; background:var(--panel2); margin-bottom:10px; overflow:hidden;}
.collapse > button{width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; color:var(--text); font-size:15px; font-weight:700; padding:13px 16px; cursor:pointer; text-align:left; font-family:var(--sans);}
.collapse > button .idx{color:var(--accent); font-family:var(--sans); font-size:12px; font-weight:600;}
.collapse > button .arr{margin-left:auto; color:var(--dim); transition:transform .2s; font-size:12px;}
.collapse.open > button .arr{transform:rotate(180deg);}
.collapse .bd{padding:2px 18px 16px; font-size:14px; color:#C9D2E2;}
.collapse .bd p{margin-bottom:10px;}
.collapse .bd ul{margin:2px 0 10px 4px; list-style:none;}
.collapse .bd ul li{padding:4px 0 4px 16px; position:relative;}
.collapse .bd ul li::before{content:""; position:absolute; left:0; top:13px; width:7px; height:7px; border-radius:2px; background:var(--line2);}
.collapse .bd table{width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:13px;}
.collapse .bd th,.collapse .bd td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top;}
.collapse .bd th{background:var(--panel3); color:var(--dim); font-weight:600; font-size:12.5px;}
.collapse .bd td b{color:var(--text);}
.collapse .bd .ql{color:#B7A6F5; border-left:2px solid var(--l0); padding:8px 12px; margin:8px 0; background:rgba(167,139,250,.06); border-radius:0 8px 8px 0;}
.interact{border:1px dashed var(--line2); border-radius:14px; background:linear-gradient(180deg, rgba(53,66,98,.18), rgba(16,22,36,.2)); padding:18px 20px; margin:18px 0;}
.interact h3{font-size:15px; margin-bottom:2px;}
.interact h3 span{color:var(--accent); font-size:12px; font-weight:600; margin-right:8px;}
.interact .note{color:var(--dim); font-size:12.5px; margin-bottom:12px;}
.takeaway{background:linear-gradient(120deg, rgba(251,191,36,.10), rgba(251,191,36,.03)); border:1px solid rgba(251,191,36,.28); border-radius:14px; padding:18px 20px; margin:18px 0;}
.takeaway h4{color:var(--accent); font-size:12.5px; letter-spacing:1px; margin-bottom:8px;}
.takeaway p{font-family:var(--serif); font-size:16px; line-height:1.9; color:#F3E7C8;}
.introspect{background:linear-gradient(120deg, rgba(167,139,250,.10), rgba(167,139,250,.03)); border:1px solid rgba(167,139,250,.3); border-radius:14px; padding:18px 20px; margin:18px 0;}
.introspect h4{color:var(--l0); font-size:12.5px; letter-spacing:1px; margin-bottom:10px;}
.introspect ul{list-style:none;}
.introspect li{color:#C9C2E8; font-size:13.5px; padding:6px 0 6px 16px; position:relative;}
.introspect li::before{content:""; position:absolute; left:0; top:14px; width:7px; height:7px; border-radius:50%; background:var(--l0);}
.prevnext{display:flex; justify-content:space-between; gap:12px; margin-top:26px; flex-wrap:wrap;}
.prevnext a{flex:1; min-width:220px; border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:12px 16px; text-decoration:none; color:var(--text); transition:border-color .15s;}
.prevnext a:hover{border-color:var(--line2);}
.prevnext a small{display:block; color:var(--faint); font-size:11.5px;}
.prevnext a b{font-size:14px;}

/* ===== 交互组件 ===== */
.ix-flex{display:flex; gap:14px; flex-wrap:wrap; align-items:stretch;}
.ix-flex > *{flex:1 1 240px;}
.ix-panel{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-height:120px; font-size:13.5px; color:#C9D2E2;}
.ix-panel b{color:var(--text);}
.ix-panel h5{font-size:12px; color:var(--dim); letter-spacing:1px; margin-bottom:8px;}
.wheel-svg{width:100%; max-width:340px; height:auto; display:block; margin:0 auto; cursor:pointer;}
.wheel-svg .sector{cursor:pointer;}
.wheel-svg .sector:hover{opacity:.85;}
.wheel-svg .sector.sel{stroke:#fff; stroke-width:2;}
input[type=range]{width:100%; accent-color:var(--accent); min-height:30px;}
.slider-wrap{margin:6px 0 2px;}
.slider-labels{display:flex; justify-content:space-between; color:var(--faint); font-size:11.5px;}
.calib-out{background:var(--panel3); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13.5px; margin-top:10px; min-height:64px;}
.checklist-item{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line);}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input{width:20px; height:20px; accent-color:var(--accent); margin-top:3px; flex:none;}
.checklist-item .ct{font-size:13.5px;}
.checklist-item .ct small{display:block; color:var(--faint); font-size:12px;}
.verdict{margin-top:10px; border-radius:10px; padding:11px 14px; font-size:13.5px; background:var(--panel3); border:1px solid var(--line);}
.tabs{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
.tab{border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:999px; padding:7px 15px; font-size:13px; cursor:pointer; transition:all .15s; font-family:var(--sans);}
.tab.sel{background:var(--accent); color:#141000; border-color:transparent; font-weight:600;}
.steps-line{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.stepnode{min-height:44px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer; transition:all .18s; font-family:var(--sans);}
.stepnode.active{background:var(--accent); color:#141000; border-color:transparent; font-weight:600;}
.stepnode.done{border-color:#3A4B6E; color:var(--text);}
.engine{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:760px){ .engine{grid-template-columns:1fr;} }
.engine .track{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel2);}
.engine .track h5{padding:10px 14px; font-size:13px; letter-spacing:1px;}
.engine .track.a h5{background:rgba(59,130,246,.16); color:#9CC3FA;}
.engine .track.b h5{background:rgba(167,139,250,.16); color:#CDBFFC;}
.eng-item{padding:10px 14px; border-top:1px solid var(--line); cursor:pointer; transition:background .15s;}
.eng-item:hover{background:var(--panel3);}
.eng-item.sel{background:var(--panel3);}
.eng-item b{font-size:13.5px;}
.eng-item p{font-size:12.5px; color:var(--dim); margin-top:2px;}
.warn-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){ .warn-cards{grid-template-columns:1fr;} }
.warn{border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:14px 16px;}
.warn h5{font-size:14px; margin-bottom:6px;}
.warn .wt{font-size:12px; color:var(--dim); margin-bottom:6px;}
.warn .ck{font-size:12.5px; color:#9FD8B4; border-top:1px dashed var(--line); padding-top:8px;}
.builder-field{margin-bottom:12px;}
.builder-field label{display:block; font-size:13px; color:var(--dim); margin-bottom:5px;}
.builder-field input,.builder-field textarea{width:100%; background:var(--panel3); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:9px 12px; font-size:13.5px; font-family:var(--sans);}
.builder-field textarea{min-height:52px; resize:vertical;}
.builder-field input::placeholder,.builder-field textarea::placeholder{color:var(--faint);}
.roles{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){ .roles{grid-template-columns:1fr;} }
.role{border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:14px 16px; cursor:pointer; transition:border-color .15s; text-align:left; font-family:var(--sans); color:var(--text);}
.role.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(251,191,36,.2);}
.role b{font-size:15px;}
.role .rd{color:var(--dim); font-size:12.5px; margin-top:3px;}
.sort-wrap{display:flex; flex-direction:column; gap:8px; max-width:460px;}
.sort-item{display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--panel3); border-radius:10px; padding:9px 12px; user-select:none;}
.sort-item .grip{color:var(--faint); cursor:grab; font-size:15px;}
.sort-item .nm{font-weight:700; font-size:14px; flex:1;}
.sort-item button{border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:7px; width:32px; height:32px; cursor:pointer; font-size:14px;}
.sort-item button:hover{color:var(--text); border-color:var(--line2);}
.sort-item.dragover{border-color:var(--accent);}
.timeline{display:grid; grid-template-columns:70px 26px 1fr; gap:0; margin:6px 0;}
.tl-row{display:contents;}
.tl-time{font-size:12px; color:var(--faint); padding:14px 0; text-align:right;}
.tl-axis{display:flex; justify-content:center; position:relative;}
.tl-axis::before{content:""; width:2px; background:var(--line2); position:absolute; top:0; bottom:0;}
.tl-dot{width:12px; height:12px; border-radius:50%; background:var(--accent); align-self:center; position:relative; z-index:1;}
.tl-dot.d1{background:var(--l2);} .tl-dot.d2{background:var(--l3);} .tl-dot.d3{background:var(--l5);}
.tl-body{padding:12px 0 12px 14px;}
.tl-body b{font-size:13.5px;}
.tl-body p{font-size:12.5px; color:var(--dim); margin-top:2px;}
.footnote{color:var(--faint); font-size:12px; margin-top:14px; border-top:1px solid var(--line); padding-top:14px;}
.footnote ul{margin:6px 0 0 18px;}

/* ===== 响应式 ===== */
@media (max-width:1080px){ .topic-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width:900px){
  .main{grid-template-columns:1fr;}
  .rq-grid{grid-template-columns:repeat(2,1fr);}

  intro:'本页对应体系第三层讨论机制。两个人都可以进行结构化分析，却可能得到完全不同的结果——因为他们使用不同的定义、接受不同的事实、默认不同的前提。基线解决的就是"我们到底按照什么规则讨论"。',
  sections:[
    {h:'四大基线及其分工',table:{head:['基线','本质','防止的问题'],rows:[['① 概念定义','确定讨论对象','偷换概念、语义混乱'],['② 标准约束','确定评价函数','双方评价体系不同'],['③ 事实依据','确定证据可信度','前提本身为假'],['④ 逻辑遵循','保证推理有效','跳步、偷换、循环论证、相关当因果']]},p:'很多争论不是观点不同，而是讨论对象不同（"AI 取代程序员"需先定义 AI/取代/程序员）；或评价函数不同（NBA GOAT 之争：按 MVP 还是按巅峰高度，双方都可能正确）。'},
    {h:'逻辑的边界：事实依据必须独立成层',p:'逻辑只能保证"前提为真则结论成立"，不能保证前提本身真实——所以事实依据必须独立成层。'},
    {h:'讨论精度模型：基线不变，宽容度变',p:'不同场景不是采用不同规则，而是不同的精度要求。分配原则：讨论越重要、结论影响越大、可逆性越低，基线要求越高；交流启发型讨论可放宽但不能放弃基线。讨论成本是第二维度——不是所有问题都值得同等严谨。'},
    {h:'退出讨论也是理性结论',items:['四种"讨论无效"情形：① 概念没统一（讨论对象已不同）② 评价标准不同且都自洽 ③ 价值观排序不同（逻辑无法证明哪种价值绝对正确）④ 事实依据不足（双方只在"我觉得"）','应停止的信号：价值观分歧且双方不接受调整、无新事实、不再回应论证只重复观点、进入情绪表达','退出讨论 ≠ 认输 = 当前讨论已无认知增量']},
    {h:'认知增量：讨论的目标重定义',table:{head:['目标','以什么为准','倾向'],rows:[['说服（Persuasion）','对方是否改变观点','输赢和辩论技巧比拼'],['认知增量（Cognitive Gain）','是否获得新认知','新事实、更准的定义、另一种标准、推理漏洞、明确的不可判断、找到真正分歧点']]},p:'讨论最大的价值，不一定是得到答案，而是缩小问题。高质量讨论的定义（即使谁也没改变观点）：讨论结束后，双方都能准确表述——① 我的观点 ② 对方的观点 ③ 真正分歧在哪里 ④ 为什么目前无法统一。'},
    {h:'完整六步框架',p:'① 概念定义（同一对象吗）→ ② 标准约束（同一标准吗）→ ③ 事实依据（认可哪些事实）→ ④ 逻辑遵循（推理成立吗）→ ⑤ 认知增量（有新认知吗）→ ⑥ 是否值得继续（还有增加认知的可能吗）。第⑤步是"收益评估"，第⑥步是"退出判断"。'}
  ],
  takeawayTitle:'一句话沉淀',
  takeaway:'讨论最大的价值，不一定是得到答案，而是缩小问题。',
  prev:'dialogue',next:'structure-engineering'
},
'structure-engineering':{

  core:'结构化思维解决"看清问题"（认知组织方式），工程化思维解决"改变现实"（系统解决方式）；两者是包含而非并列关系，中间由"模型"衔接——模型是对现实的有目的抽象，是连接问题与系统的核心枢纽。',
  intro:'本页跨体系第二层（问题处理）与第四层（执行机制），是这两层最具体的工具箱：三类模型层级链回答"模型如何衔接认知与现实"，四层抽象模型是分析任何思维方法（含其自身）的元框架，五种结构模板是工程化思维在沟通场景的直接落地。',
  sections:[

    {h:'三类模型的层级链',p:'现实问题 → 问题模型（结构化思维，逻辑结构）→ 信息模型（数据结构）→ 数学模型（预测计算）→ 预测/决策。模型三要素：变量、关系、边界；最重要的模型往往是最简单的结构模型。'},
    {h:'概念的通俗表达（业务沟通）',table:{head:['逻辑阶段','真实方法','业务表达'],rows:[['理解问题','结构化思维','"我们先把问题拆开来看"'],['解释问题','模型','"可以用一个简单框架理解"'],['解决问题','工程化思维','"分三步落地"']]},p:'汇报三句话：先拆问题 → 再给框架 → 再讲落地。更高阶技巧：不要说方法论，要展示结构。'},
    {h:'五种业务解释结构模板',table:{head:['结构','回答的问题','典型句式'],rows:[['拆解结构','问题由哪些部分组成','"主要受三个因素影响"'],['因果结构','为什么会发生','"原因有三个"'],['公式结构','核心变量关系是什么','"GMV = 流量 × 转化率 × 客单价"'],['流程结构','事情如何发生','"整个过程分三个阶段"'],['方案结构','我们准备怎么做','"优化路径主要有三步"']]},p:'五种结构对应人类理解世界的五种基本逻辑：结构、因果、数学、时间、行动。典型组合：拆解 → 公式 → 因果 → 方案。'},
    {h:'认知抽象层级模型：事实 → 功能 → 逻辑 → 原理',table:{head:['层级','回答的问题','数据可视化对应'],rows:[['事实层（表象）','发生了什么','图表（柱状图、折线图）'],['功能层','系统在做什么','信息表达 / 沟通'],['逻辑层（机制）','它是如何做到的','视觉编码（数据 → 视觉映射）'],['原理层（本质）','为什么能够做到','人类视觉认知优势']]},p:'这是"从表象到本质"的四层理解框架。自反应用：结构化思维本身主要位于逻辑层；原理层是认知容量有限（7±2）、复杂系统需要抽象、信息传递效率。判断一个概念是否被真正理解的标准：四层都能解释清楚才算完整理解。层级错位是"各说各话"的常见根源：同一问题，有人在事实层回答、有人在逻辑层回答。'},
    {h:'可视化 ≠ 画图',p:'可视化是"利用视觉系统理解数据的认知工具"；几乎所有信息系统（UI/信息设计/交互）底层都是"界面 → 表达 → 编码 → 认知"同一套机制。'}

'thinker-traits':{
  id:'thinker-traits',nav:'思考者特质',badge:'元层',badgeBg:'#A78BFA',

  core:'从提问方式看，提问者不是在"要答案"，而是在测试解释力的上限——而思考能力已经不是瓶颈，思考的自我约束机制才是。',
  intro:'本页是体系的第零层（元层）：其他文档在建设体系的内容，本页把"提问者自身"作为分析对象，提供一套针对体系拥有者的校准机制——双轨引擎中的 B 轨道，正是对"逻辑优先 + 结构化优势"这一判断风格的定向制衡。',
  sections:[
    {h:'从提问方式中提炼的四个核心特质',items:['测试解释力上限，而非要答案：问题自带结构（对立面、路径、层级、时间尺度）；对结论兴趣有限，对论证能否自洽、能否承压兴趣更大；常要求"反过来摧毁""换立场攻击""暴露隐含前提"','习惯把个人问题提升到制度/结构/历史尺度：个体现象 → 制度选择 → 长期结构后果；天然使用结构主义 + 历史主义混合视角','对思维偏误高度自觉，且不满足于提醒层面（二阶思维）：不仅思考问题，还思考"我正在用什么工具思考问题"','技术问题上的"工程化哲学"倾向：把抽象问题 → 转译为结构 → 再转译为可运行系统；把思想当作系统来实现']},
    {h:'结构性副作用（不是缺点，是需要制衡的倾向）',items:['解释过强，可能压扁真实世界的不确定性：太自洽、太结构化、太能预测的解释容易提前终结探索','高层抽象稀释情绪与经验密度：结构化语言进入非理性场景时降低共感效率——这是尺度切换成本','对抗性思考成为默认模式：反驳、拆解、换立场攻击在思想实验里是优势，在协作环境中可能被感知为"持续施压"']},
    {h:'双轨思考引擎 · 运行流程',p:'先跑 A 轨道：把问题拆到足够清楚、锋利；再切 B 轨道：专门破坏刚建立的"漂亮解释"；最后做总检验。'},
    {h:'配套原则与提醒',items:['三种提问模式要有意识切换：拆解型（论证哪里最脆弱）/ 生成型（不推翻前提下还能生出什么结论）/ 共感型（如果我是其中一个具体的人会感受什么）','思考工具化的自检问题："这个工具是帮我思考，还是在强化我已经习惯的思考路径？"——好的思考工具应该偶尔让你不舒服','成年人"都要"的代价：不再追求完美解释、接受部分混乱长期存在、允许某些问题上只做到"暂时合理"']}

  takeawayTitle:'总结性判断（原文金句）',

},

  intro:'本页对应体系第五层。它对应的笔记是《AI与个人边界变化》长对话的结构化沉淀，是判断体系的"第一版显性化快照"，也是"思考的工程化"的第一个实例——面对 AI 没有长期记忆的约束，用结构化模板把对话产出固化为可反复使用的资产。',
  sections:[

    {h:'待消化与下一步思考点',items:['可重建性 vs 核心方向','显性化规则：隐性规则外显、在现实决策中验证稳定性','主动证伪机制：建模阶段设计失败出口、防逻辑模型被自我认同绑架','实践场景选择：从小真实判断开始拆解、提炼规则模板、跨场景验证稳健性']},

  takeawayTitle:'判断力定义（关键纠偏）',

'ai-boundary':{
  id:'ai-boundary',nav:'AI 与个人边界',badge:'第五层 + 人机',badgeBg:'#FBBF24',
  coord:['第五层 · 最终能力 + 人机协同','判断 → 迭代','我如何判断？'],src:'AI与个人边界变化-总结.md',
  core:'当 AI 承担记忆、计算等外部能力后，个人的边界从"能力边界"转向"价值与选择边界"；人从工具的使用者变成认知系统的组织者——而真正要建立的不是"想成为有强判断力的人"这个愿望，而是一套带纠错回路的、可显性化的判断规则体系。',
  intro:'本页是体系第五层"个人判断体系"真正开始成形的地方：首次给出四层结构框架、证据排序及其批判性检视、愿望/体系之分、主动证伪机制；同时确立"人与 AI"在这套体系中的位置。',
  sections:[
    {h:'边界的三种变化',items:['功能边界扩张，认知边界模糊："我会"和"我能调用"不再清晰区分——只更快调用答案而不更深消化，会产生"知识幻觉"','能力收缩 vs 判断力浓缩：年龄让原始算力（记忆、反应、带宽）下降，但判断力、模式识别、价值取向更稳定；AI 弥补算力，无法替代"你认为什么重要"','个体边界外移，自我核心收缩：外部能做的越来越多，真正属于"你"的只剩判断、欲望、伦理与方向']},
    {h:'人的三种认知角色',table:{head:['角色','行为','定位'],rows:[['被投喂者','接收结果','被动'],['操作者','调用工具','主动'],['组织者','设计认知流程','稀缺']]},p:'"掌控 AI"的重新定义：不是掌控整个系统，而是掌控"你 + AI"的组合形态——如何提问、如何拆解、如何判断输出、如何把工具嵌入自己的决策结构。'},
    {h:'隐忧与依赖性',p:'把 AI 当拐杖会削弱你，当放大镜会增强你。差别在于是否保留"原始思考的肌肉"：提问能力、独立推演、对不确定性的耐受。'},
    {h:'愿望结构 vs 判断体系（最关键区分）',p:'"我想成为一个有极强自我判断体系和能力的人"——这是目标性身份/愿望结构，不是判断体系本身。真正危险的是把愿望误认为结论。分层建议：目标层（我想要什么）/ 规则层（我如何判断）/ 修正层（我如何纠错）。'},
    {h:'判断体系四层结构 + 证据排序',items:['价值优先级：什么比什么重要？冲突时如何排序？有无不可妥协项？','证据标准：什么算"足够证据"？对经验、数据、权威、逻辑的权重分配','风险态度：保守还是进取？对不确定性的容忍区间','修正机制：什么情况下推翻原判断？延迟复盘？如何防止自洽幻觉？','自报排序：逻辑 > 真实数据 > 经验 = 权威；冲突时先查数据真实性与样本偏差，再查逻辑是否普适','AI 检视：逻辑置顶是"形式优先而非事实优先"；成熟体系需按领域区分（自然科学数据优先、伦理逻辑优先、个人关系经验优先）','升级方向：从"防御性校验"到"主动可证伪结构"——写明"如果出现 A/B/C，我将放弃这个判断"']},
    {h:'结构连续性（对 AI 关系的定义）',p:'其核心不是记忆，而是：逻辑自洽、内部标准一致、对同样问题应用同样规则。人类关系的温度来自情感记忆；人与 AI 的价值来自"结构连续性"——不建立情感历史，而建立思维路径。'}
  ],
  takeawayTitle:'最终形态（金句）',
  takeaway:'边界会重组而非无限扩张——记忆在外、计算在外、资料在外、但意义在内；半径变大，中心更重要。AI 像外骨骼：不让你成为别人，但让你保留自己更久。',
  prev:'judgment-system',next:'thinker-traits'
}

</script><script>
/* ===== 组件库 ===== */
var C = {
  esc:function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
  lyrName:function(id){ if(!id) return '起点 / 闭环'; var all=SITE.layers.concat([SITE.io]); for(var i=0;i<all.length;i++){ if(all[i].id===id) return all[i].name; } return '起点 / 闭环'; },
  layerById:function(id){ var all=SITE.layers.concat([SITE.io]); for(var i=0;i<all.length;i++){ if(all[i].id===id) return all[i]; } return null; }
};
/* 折叠卡 */
function collapsibleCard(idx, sec){
  var h = '<div class="collapse'+(idx===0?' open':'')+'"><button type="button" aria-expanded="'+(idx===0)+'"><span class="idx">'+(idx+1)+'</span><span>'+C.esc(sec.h)+'</span><span class="arr">▼</span></button><div class="bd">';
  if(sec.p) h += '<p>'+C.esc(sec.p)+'</p>';
  if(sec.items) h += '<ul>'+sec.items.map(function(x){return '<li>'+C.esc(x)+'</li>';}).join('')+'</ul>';
  if(sec.table){ h += '<table><thead><tr>'+sec.table.head.map(function(x){return '<th>'+C.esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
    h += sec.table.rows.map(function(r){ return '<tr>'+r.map(function(x){return '<td>'+C.esc(x)+'</td>';}).join('')+'</tr>'; }).join('');
    h += '</tbody></table>'; }
  h += '</div></div>';
  return h;
}
function bindCollapse(root){
  var cols = root.querySelectorAll('.collapse > button');
  for(var i=0;i<cols.length;i++){
    cols[i].addEventListener('click', function(){
      var card = this.parentNode;
      var open = card.classList.toggle('open');
      this.setAttribute('aria-expanded', open?'true':'false');
      var bd = card.querySelector('.bd');
      if(bd) bd.style.display = open?'':'none';
    });
  }
}

/* ===== 顶部导航 / 页脚 / 足迹 / 自省模式 ===== */
var INTRO = { on:false };
function renderNav(cur){
  var nav = document.getElementById('nav'); if(!nav) return;
  var items = [{id:'',nav:'主页' }];
  for(var k in SITE.topics){ items.push(SITE.topics[k]); }
  nav.innerHTML = items.map(function(t){
    var href = t.id==='' ? '#/' : '#/t/'+t.id;
    return '<a href="'+href+'"'+(cur===t.id?' class="cur"':'')+'>'+C.esc(t.nav)+'</a>';
  }).join('');
}
function renderFooter(){
  var f = document.getElementById('siteFooter'); if(!f) return;
  f.innerHTML = '<b>内容来源（thinking_docs/ 总结文档，共 '+SITE.meta.sources.length+' 份）：</b><ul>'+SITE.meta.sources.map(function(s){return '<li>'+C.esc(s)+'</li>';}).join('')+'</ul>';
}
function fpRecord(id){
  if(!id) return;
  try{
    var arr = JSON.parse(sessionStorage.getItem('sitedoubao_fp')||'[]');
    if(arr.indexOf(id)<0){ arr.push(id); sessionStorage.setItem('sitedoubao_fp', JSON.stringify(arr)); }
  }catch(e){}
  renderFootprint();
}
function renderFootprint(){
  var fp = document.getElementById('footprint'); if(!fp) return;
  var arr=[];
  try{ arr = JSON.parse(sessionStorage.getItem('sitedoubao_fp')||'[]'); }catch(e){}
  if(!arr.length){ fp.innerHTML=''; return; }
  var names = arr.map(function(id){ return SITE.topics[id]?SITE.topics[id].nav:id; });
  fp.innerHTML = '<b>本次探索足迹：</b>'+names.join(' → ')+'<button class="fp-clear" type="button">清除</button>';
  var btn = fp.querySelector('.fp-clear');
  if(btn) btn.addEventListener('click', function(){ try{sessionStorage.removeItem('sitedoubao_fp');}catch(e){} renderFootprint(); });
}
function initIntrospection(){
  var btn = document.getElementById('introBtn'); if(!btn) return;
  try{ INTRO.on = localStorage.getItem('sitedoubao_intro')==='1'; }catch(e){}
  btn.classList.toggle('on', INTRO.on);
  btn.setAttribute('aria-pressed', INTRO.on?'true':'false');
  btn.addEventListener('click', function(){
    INTRO.on = !INTRO.on;
    btn.classList.toggle('on', INTRO.on);
    btn.setAttribute('aria-pressed', INTRO.on?'true':'false');
    try{ localStorage.setItem('sitedoubao_intro', INTRO.on?'1':'0'); }catch(e){}
    render();
  });
}

  var html = '<div class="bc"><a href="#/">体系全景</a><span class="sep">/</span><span>'+C.esc(topic.nav)+'</span></div>';
  html += '<div class="phead"><h1>'+C.esc(topic.nav)+'</h1><span class="badge" style="background:'+topic.badgeBg+'">'+C.esc(topic.badge)+'</span></div>';

  html += '<div class="oneliner">'+C.esc(topic.core)+'</div>';
  html += '<p style="color:var(--dim);font-size:14px;margin:10px 0 18px;">'+C.esc(topic.intro)+'</p>';
  html += '<div class="sechead">核心论点<small>卡面是结论，展开是论据；全部内容源自对应总结文档</small></div>';
  topic.sections.forEach(function(sec,i){ html += collapsibleCard(i, sec); });

  html += '<div class="takeaway"><h4>'+C.esc(topic.takeawayTitle)+'</h4><p>'+C.esc(topic.takeaway)+'</p></div>';
  if(INTRO.on){ html += introspectBlock(); }
  var prev = topic.prev ? SITE.topics[topic.prev] : null;
  var next = topic.next ? SITE.topics[topic.next] : null;
  html += '<div class="prevnext">'+
    (prev?'<a href="#/t/'+prev.id+'"><small>← 上一相关页</small><b>'+C.esc(prev.nav)+'</b></a>':'<a href="#/" style="opacity:.5;"><small>← 返回</small><b>体系全景</b></a>')+
    (next?'<a href="#/t/'+next.id+'"><small>下一相关页 →</small><b>'+C.esc(next.nav)+'</b></a>':'<a href="#/" style="opacity:.5;"><small>→ 返回</small><b>体系全景</b></a>')+

/* ===== 主循环运行器 ===== */
function loopRunner(containerId, autoPlay){
  var el = document.getElementById(containerId); if(!el) return;
  var steps = SITE.loop;
  var idx = 0, timer = null, playing = false;
  function chipHTML(s){
    return '<button type="button" class="chip" data-i="'+(s.n-1)+'" data-lyr="'+(s.lyr||'none')+'" data-done="0">'+
      '<span class="num">'+s.n+'</span><span>'+C.esc(s.t)+'</span></button>';
  }
  var html = '<div class="loop-chips">'+steps.map(chipHTML).join('')+'</div>'+
    '<div class="controls">'+
    '<button class="btn primary" id="lpPlay" type="button">播放</button>'+
    '<button class="btn" id="lpPrev" type="button">上一步</button>'+
    '<button class="btn" id="lpNext" type="button">下一步</button>'+
    '<button class="btn" id="lpReset" type="button">重置</button></div>'+
    '<div class="status" id="lpStatus"></div>';
  el.innerHTML = html;
  var chips = el.querySelectorAll('.chip');
  var st = document.getElementById('lpStatus');
  var playBtn = document.getElementById('lpPlay');
  function paint(){
    for(var i=0;i<chips.length;i++){
      chips[i].classList.toggle('active', i===idx);
      chips[i].classList.toggle('done', i<idx);
    }
    var s = steps[idx];
    st.innerHTML = '第 <b>'+(idx+1)+'</b> / '+steps.length+' 步 · 位于 <span class="lyr">'+C.lyrName(s.lyr)+'</span> — '+C.esc(s.d);
    var t = document.getElementById('homeLoopFocus'); if(t) t.textContent = C.lyrName(s.lyr);
    if(document.getElementById('stack')){
      var rows = document.getElementById('stack').querySelectorAll('.layer');
      for(var j=0;j<rows.length;j++){
        rows[j].classList.remove('hl','dim');
        if(s.lyr && rows[j].dataset.id!==s.lyr) rows[j].classList.add('dim');
        if(s.lyr && rows[j].dataset.id===s.lyr) rows[j].classList.add('hl');
      }
    }
  }
  function stop(){ if(timer){ clearInterval(timer); timer=null; } playing=false; playBtn.textContent='播放'; }
  function stepTo(i){ idx=Math.max(0,Math.min(steps.length-1,i)); paint(); }
  playBtn.addEventListener('click', function(){
    if(playing){ stop(); return; }
    playing=true; playBtn.textContent='暂停';
    if(idx>=steps.length-1) idx=-1;
    timer=setInterval(function(){
      if(idx+1>=steps.length){ stop(); stepTo(steps.length-1); return; }
      stepTo(idx+1);
    },1600);
  });
  document.getElementById('lpPrev').addEventListener('click', function(){ stop(); stepTo(idx-1); });
  document.getElementById('lpNext').addEventListener('click', function(){ stop(); stepTo(idx+1); });
  document.getElementById('lpReset').addEventListener('click', function(){ stop(); stepTo(0); if(document.getElementById('stack')){ var rows=document.getElementById('stack').querySelectorAll('.layer'); for(var j=0;j<rows.length;j++){rows[j].classList.remove('hl','dim');} } });
  for(var i=0;i<chips.length;i++){
    chips[i].addEventListener('click', function(){ stop(); stepTo(parseInt(this.getAttribute('data-i'),10)); });
  }
  stepTo(autoPlay?0:0);
}

function bindStack(){
  var stack = document.getElementById('stack'); if(!stack) return;
  var rows = stack.querySelectorAll('.layer');
  function show(L){
    for(var i=0;i<rows.length;i++){ rows[i].classList.toggle('sel', rows[i].dataset.id===L.id); }
    var d = document.getElementById('detail'); if(!d) return;
    var h = '<div class="d-head"><span class="d-dot" style="background:'+L.color+'"></span><span class="d-title" style="color:'+L.color+'">'+C.esc(L.name)+'</span></div>';
    h += '<div class="d-q" style="border-color:'+L.color+'">回答：'+C.esc(L.q)+'</div>';
    h += '<div class="d-sec"><h4>核心概念</h4><ul>'+L.core.map(function(x){return '<li>'+C.esc(x)+'</li>';}).join('')+'</ul></div>';
    if(L.toolbox) h += '<div class="d-sec"><h4>工具箱</h4><div class="big">'+C.esc(L.toolbox)+'</div></div>';
    h += '<div class="d-sec"><h4>关键词</h4><ul>'+L.kw.map(function(x){return '<li>'+C.esc(x)+'</li>';}).join('')+'</ul></div>';
    h += '<div class="d-sec"><h4>相关子页</h4><div class="d-pages">'+L.pages.map(function(p){ return '<a class="d-page" href="#/t/'+topicIdByNav(p.t)+'">'+C.esc(p.t)+'<small>来源：'+C.esc(p.s)+'</small></a>'; }).join('')+'</div></div>';
    d.innerHTML = h;
  }
  for(var i=0;i<rows.length;i++){
    (function(row){
      row.addEventListener('click', function(){
        var L = C.layerById(row.dataset.id); if(L) show(L);
      });
    })(rows[i]);
  }
  show(SITE.layers[1]); /* 默认展示第一层 */
}
function topicIdByNav(nav){
  for(var k in SITE.topics){ if(SITE.topics[k].nav===nav) return k; }
  return '';
}
function bindRoots(){
  var grid = document.getElementById('rqGrid'); if(!grid) return;
  var cards = grid.querySelectorAll('.rq');
  var out = document.getElementById('rq-result');
  function clearSel(){ for(var i=0;i<cards.length;i++){ cards[i].classList.remove('sel'); } }
  for(var i=0;i<cards.length;i++){
    (function(card){
      card.addEventListener('click', function(){
        clearSel(); card.classList.add('sel');
        var id = card.getAttribute('data-id');
        var r = null; for(var j=0;j<SITE.roots.length;j++){ if(SITE.roots[j].id===id) r=SITE.roots[j]; }
        if(!r) return;
        var rows = document.getElementById('stack').querySelectorAll('.layer');
        for(var k=0;k<rows.length;k++){
          rows[k].classList.remove('sel');
          if(r.layers.indexOf(rows[k].dataset.id)>=0){ rows[k].classList.add('sel'); rows[k].classList.remove('dim'); }
          else rows[k].classList.add('dim');
        }
        out.innerHTML = '<b>'+C.esc(r.t)+'</b> 聚合的层：'+r.layers.map(C.lyrName).join(' · ')+'；聚合的子页：'+r.pages.map(C.esc).join('、')+'。';
      });
    })(cards[i]);
  }
}
function renderTopicGrid(){
  var g = document.getElementById('topicGrid'); if(!g) return;
  var order = ['thinker-traits','critical-thinking','dialogue','baselines','structure-engineering','judgment-system','ai-boundary'];
  g.innerHTML = order.map(function(id){
    var t = SITE.topics[id];
    return '<a class="topic" href="#/t/'+id+'"><span class="badge" style="background:'+t.badgeBg+'">'+C.esc(t.badge)+'</span><div class="nm">'+C.esc(t.nav)+'</div><div class="ess">'+C.esc(t.core.length>42?t.core.slice(0,42)+'…':t.core)+'</div><div class="src">来源：'+C.esc(t.src)+'</div></a>';
  }).join('');
}
/* 关联图谱：SVG 圆形布局 + 关系明细 */
function renderRelGraph(){
  var svg = document.getElementById('relGraph'); if(!svg) return;
  var ns = 'http://www.w3.org/2000/svg';
  var order = ['thinker-traits','critical-thinking','dialogue','baselines','structure-engineering','judgment-system','ai-boundary'];
  var n = order.length, cx=280, cy=205, R=150;
  var pos = {};
  order.forEach(function(id,i){
    var ang = -Math.PI/2 + i*(2*Math.PI/n);
    pos[id] = [cx+R*Math.cos(ang), cy+R*Math.sin(ang)];
  });
  var edges = SITE.relations;
  var edgeLines = '';
  for(var i=0;i<edges.length;i++){
    var e = edges[i];
    var p1 = pos[e.from], p2 = pos[e.to];
    var mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
    edgeLines += '<line x1="'+p1[0]+'" y1="'+p1[1]+'" x2="'+p2[0]+'" y2="'+p2[1]+'" stroke="#33435F" stroke-width="1.2" opacity="0.75"><title>'+C.esc(SITE.topics[e.from].nav+' ↔ '+SITE.topics[e.to].nav+'：'+e.label)+'</title></line>';
  }
  var nodes = '';
  order.forEach(function(id){
    var t = SITE.topics[id];
    var x = pos[id][0], y = pos[id][1];
    nodes += '<a href="#/t/'+id+'" style="cursor:pointer;"><circle cx="'+x+'" cy="'+y+'" r="34" fill="'+t.badgeBg+'" opacity="0.92"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1020">'+C.esc(shortName(t.nav))+'</text></a>';
  });
  svg.innerHTML = edgeLines + nodes;
  var list = document.getElementById('relList');
  if(list){
    list.innerHTML = edges.map(function(e){
      return '<div class="ix-panel" style="min-height:auto;padding:9px 12px;"><a href="#/t/'+e.from+'" style="color:var(--text);text-decoration:none;">'+C.esc(SITE.topics[e.from].nav)+'</a> ↔ <a href="#/t/'+e.to+'" style="color:var(--text);text-decoration:none;">'+C.esc(SITE.topics[e.to].nav)+'</a><div style="font-size:12px;color:var(--faint);">'+C.esc(e.label)+'</div></div>';
    }).join('');
  }
}
function shortName(nav){
  var m = nav.match(/^([^\s×]+)/);
  return m ? m[1] : nav.slice(0,4);
}

/* ===== 路由 ===== */
function currentRoute(){
  var h = location.hash || '#/';
  var m = h.match(/^#\/t\/([a-z\-]+)/);
  if(m && SITE.topics[m[1]]) return {type:'topic', id:m[1]};
  return {type:'home', id:''};
}
function render(){
  var r = currentRoute();
  renderNav(r.id);
  if(r.type==='topic'){
    var t = SITE.topics[r.id];
    renderTopicPage(t);
    fpRecord(r.id);
  } else {
    renderHome();
  }
  renderFootprint();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);

  zone.innerHTML = wheelHTML + calibHTML;

      var items = list.querySelectorAll('.sort-item');
      var idx = Array.prototype.indexOf.call(items, item);
      reorder(idx, t.classList.contains('up') ? -1 : 1);
    }
  });
  list.addEventListener('dragstart', function(e){ var t=e.target.closest('.sort-item'); if(t){ dragEl=t; e.dataTransfer.effectAllowed='move'; } });
  list.addEventListener('dragover', function(e){ e.preventDefault(); var t=e.target.closest('.sort-item'); if(t && t!==dragEl){ t.classList.add('dragover'); } });
  list.addEventListener('dragleave', function(e){ var t=e.target.closest('.sort-item'); if(t) t.classList.remove('dragover'); });
  list.addEventListener('drop', function(e){
    e.preventDefault();
    var t=e.target.closest('.sort-item');
    if(t && dragEl && t!==dragEl){
      list.insertBefore(dragEl, t.nextSibling===dragEl?t:t.nextSibling);
      orderNow();
    }
    var items=list.querySelectorAll('.sort-item'); for(var i=0;i<items.length;i++){ items[i].classList.remove('dragover'); }
  });
  list.addEventListener('dragend', function(){ dragEl=null; var items=list.querySelectorAll('.sort-item'); for(var i=0;i<items.length;i++){ items[i].classList.remove('dragover'); } });
  orderNow();
};

/* ===== 启动 ===== */
render();
initIntrospection();
renderFooter();

</script></body>
</html>
